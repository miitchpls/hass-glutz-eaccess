name: Format check

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  ruff-format:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
