name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release?'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' homeassistant/components/glutz_eaccess/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          cd homeassistant/components/glutz_eaccess
          zip -r ../../../glutz_eaccess.zip . --exclude "*.pyc" --exclude "__pycache__/*" --exclude "quality_scale.yaml"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: glutz_eaccess.zip
